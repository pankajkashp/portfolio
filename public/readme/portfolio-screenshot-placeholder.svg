<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio screenshot placeholder</title>
  <desc id="desc">A dark, polished placeholder image indicating where future screenshots can be added.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1500" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05050A" />
      <stop offset="0.52" stop-color="#0A0A12" />
      <stop offset="1" stop-color="#12061F" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1140 270) rotate(135) scale(480 420)">
      <stop stop-color="#A855F7" stop-opacity="0.36" />
      <stop offset="0.55" stop-color="#7C3AED" stop-opacity="0.16" />
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="stroke" x1="240" y1="150" x2="1360" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.14" />
      <stop offset="0.5" stop-color="white" stop-opacity="0.06" />
      <stop offset="1" stop-color="#A855F7" stop-opacity="0.18" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
  </defs>

  <rect width="1600" height="900" rx="42" fill="url(#bg)" />
  <rect x="48" y="48" width="1504" height="804" rx="34" stroke="url(#stroke)" stroke-width="1.5" fill="rgba(255,255,255,0.01)" />

  <circle cx="1140" cy="290" r="280" fill="url(#glow)" filter="url(#blur)" />
  <circle cx="420" cy="670" r="180" fill="#A855F7" fill-opacity="0.12" filter="url(#blur)" />

  <rect x="110" y="110" width="450" height="22" rx="11" fill="white" fill-opacity="0.08" />
  <rect x="110" y="154" width="260" height="14" rx="7" fill="white" fill-opacity="0.05" />

  <rect x="110" y="240" width="620" height="320" rx="28" fill="white" fill-opacity="0.03" stroke="white" stroke-opacity="0.08" />
  <rect x="165" y="292" width="290" height="18" rx="9" fill="white" fill-opacity="0.12" />
  <rect x="165" y="334" width="470" height="12" rx="6" fill="white" fill-opacity="0.06" />
  <rect x="165" y="360" width="420" height="12" rx="6" fill="white" fill-opacity="0.06" />
  <rect x="165" y="386" width="380" height="12" rx="6" fill="white" fill-opacity="0.06" />
  <rect x="165" y="444" width="170" height="50" rx="25" fill="#A855F7" fill-opacity="0.9" />
  <rect x="350" y="444" width="170" height="50" rx="25" fill="white" fill-opacity="0.06" />

  <rect x="790" y="170" width="700" height="510" rx="34" fill="white" fill-opacity="0.03" stroke="white" stroke-opacity="0.08" />
  <rect x="845" y="230" width="205" height="16" rx="8" fill="white" fill-opacity="0.10" />
  <rect x="845" y="270" width="540" height="12" rx="6" fill="white" fill-opacity="0.05" />
  <rect x="845" y="296" width="500" height="12" rx="6" fill="white" fill-opacity="0.05" />
  <rect x="845" y="340" width="610" height="270" rx="24" fill="#06060A" fill-opacity="0.75" stroke="#A855F7" stroke-opacity="0.16" />

  <rect x="886" y="382" width="90" height="90" rx="24" fill="#A855F7" fill-opacity="0.18" />
  <rect x="1000" y="382" width="90" height="90" rx="24" fill="white" fill-opacity="0.08" />
  <rect x="1114" y="382" width="90" height="90" rx="24" fill="#A855F7" fill-opacity="0.12" />
  <rect x="1228" y="382" width="90" height="90" rx="24" fill="white" fill-opacity="0.08" />

  <text x="110" y="690" fill="white" fill-opacity="0.92" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="44" font-weight="700">
    Screenshot placeholder
  </text>
  <text x="110" y="742" fill="white" fill-opacity="0.56" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="500">
    Replace this file with your future project screenshots when you are ready.
  </text>
  <text x="110" y="781" fill="white" fill-opacity="0.42" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="400">
    Suggested location: public/readme/
  </text>
</svg>
